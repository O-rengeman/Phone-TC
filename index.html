<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Keep <html lang> in sync with the in-app language preference before
      // first paint (the static markup can't know the user's choice).
      try {
        var l = localStorage.getItem('ltc-lang');
        if (l !== 'en' && l !== 'ja') {
          l = (navigator.language || '').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
        }
        document.documentElement.lang = l;
      } catch (e) { /* storage unavailable — keep the en default */ }
    </script>
    <link rel="icon" href="/favicon-v4.ico?v=20260729.5" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ltc-sync-icon-20260729-32.png?v=20260729.5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/ltc-sync-icon-20260729-192.png?v=20260729.5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260729.5" />
    <link rel="manifest" href="/manifest.json?v=20260729.5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LTC SYNC PRO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
